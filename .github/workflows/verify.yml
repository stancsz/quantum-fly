name: verify

on:
  push:
  pull_request:

jobs:
  clean-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . -r requirements-lock.txt
      - run: python -m pytest -q
      - run: python -m compileall -q quantum_fly scripts tests
      - run: python -c "import numpy, pyarrow, pennylane, quantum_fly"
      - name: Verify clean checkout fails safely without ignored research data
        shell: bash
        run: |
          set +e
          python -m scripts.quickstart --check --data-dir "$RUNNER_TEMP/missing-malecns"
          status=$?
          set -e
          test "$status" -eq 2
