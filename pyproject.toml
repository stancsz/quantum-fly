[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-fly"
version = "0.1.0"
description = "Small offline research skeleton for connectome-inspired portfolio experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyarrow>=15"]
license = "MIT"

[project.optional-dependencies]
quantum = ["pennylane>=0.40"]
test = ["pytest>=8"]

[project.scripts]
quantum-fly = "scripts.quickstart:main"
quantum-fly-chat = "scripts.fly_chat:main"
quantum-fly-demo = "scripts.demo:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["quantum_fly*", "scripts*"]
exclude = ["data*", "outputs*", "configs*", "tests*"]
