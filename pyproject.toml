[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-fly"
version = "0.1.0"
description = "Small offline research skeleton for connectome-inspired portfolio experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyarrow>=15"]

[project.optional-dependencies]
quantum = ["pennylane>=0.40"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
